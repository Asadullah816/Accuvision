<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accuvision LASIK Quiz Test</title>
</head>
<body>

<!-- Here is the exact code provided -->
<div id="accuvision-candidacy-quiz" class="accu-quiz-wrapper">
  
  <!-- Header & Progress Tracking -->
  <div class="accu-quiz-header">
    <div class="accu-badge">Self-Screening Assessment</div>
    <h2 class="accu-title">Are You a Candidate for LASIK?</h2>
    <p class="accu-subtitle">Complete this quick clinical screening to check your candidacy.</p>
    
    <div class="accu-progress-bar-wrap">
      <div class="accu-progress-bar" id="accuProgressBar"></div>
    </div>
    <div class="accu-step-indicator" id="accuStepIndicator">Step 1 of 10</div>
  </div>

  <form id="accuLasikForm" onsubmit="return false;" novalidate>

    <!-- ==================== PAGE 1: AGE RANGE ==================== -->
    <div class="accu-step-panel active" data-step="1">
      <h3 class="accu-step-title">What is your age range? <span class="accu-req">*</span></h3>
      <div class="accu-options-list">
        <label class="accu-option-card">
          <input type="radio" name="age_range" value="under_18">
          <span class="accu-card-box circle"></span>
          <span class="accu-card-text">Under 18</span>
        </label>
        <label class="accu-option-card">
          <input type="radio" name="age_range" value="18_29">
          <span class="accu-card-box circle"></span>
          <span class="accu-card-text">18–29</span>
        </label>
        <label class="accu-option-card">
          <input type="radio" name="age_range" value="30_39">
          <span class="accu-card-box circle"></span>
          <span class="accu-card-text">30–39</span>
        </label>
        <label class="accu-option-card">
          <input type="radio" name="age_range" value="40_54">
          <span class="accu-card-box circle"></span>
          <span class="accu-card-text">40–54</span>
        </label>
        <label class="accu-option-card">
          <input type="radio" name="age_range" value="55_plus">
          <span class="accu-card-box circle"></span>
          <span class="accu-card-text">55+</span>
        </label>
      </div>

      <div class="accu-nav-group">
        <div></div>
        <button type="button" class="accu-btn accu-btn-primary" onclick="accuNextStep(1)">Next &rarr;</button>
      </div>
    </div>
  </form>

  <!-- ==================== GATING POPUP MODAL ==================== -->
  <div id="accuModal" class="accu-modal-overlay" role="dialog" aria-modal="true" style="display:none;">
    <div class="accu-modal-dialog">
      <button type="button" class="accu-modal-close" onclick="accuCloseModal()">&times;</button>
      
      <div class="accu-modal-icon-wrap" id="accuModalIcon"></div>
      <div class="accu-modal-tag" id="accuModalTag">Clinical Tag</div>
      <h3 class="accu-modal-title" id="accuModalTitle">Notice Title</h3>
      
      <div class="accu-modal-body" id="accuModalBody"></div>

      <div class="accu-modal-actions" id="accuModalActions"></div>
    </div>
  </div>
</div>

<style>
  .accu-quiz-wrapper {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    max-width: 680px;
    margin: 24px auto;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 32px rgba(15, 43, 72, 0.08);
    border: 1px solid #e2e8f0;
    padding: 34px 28px;
    color: #1e293b;
    line-height: 1.5;
  }
  .accu-modal-overlay {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    background: rgba(15, 23, 42, 0.75) !important;
    backdrop-filter: blur(4px) !important;
    -webkit-backdrop-filter: blur(4px) !important;
    display: none;
    align-items: center !important;
    justify-content: center !important;
    z-index: 999999999 !important;
    padding: 16px !important;
    box-sizing: border-box !important;
  }
  .accu-modal-dialog {
    background: #ffffff !important;
    max-width: 520px !important;
    width: 100% !important;
    border-radius: 16px !important;
    padding: 30px 24px !important;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3) !important;
    position: relative !important;
    text-align: center !important;
    animation: accuModalZoom 0.2s ease;
    box-sizing: border-box !important;
  }
</style>

<script>
(function() {
  function ensureModalInBody() {
    var modal = document.getElementById('accuModal');
    if (modal && modal.parentNode !== document.body) {
      document.body.appendChild(modal);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ensureModalInBody);
  } else {
    ensureModalInBody();
  }

  document.querySelectorAll('input[name="age_range"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
      if (this.checked && this.value === 'under_18') {
        accuShowModal({
          type: 'alert',
          tag: 'Minimum Age Requirement',
          title: 'Age Eligibility Notice',
          message: 'Candidates must be at least 18 years of age to safely qualify for laser vision correction.'
        });
      }
    });
  });

  window.accuNextStep = function(step) {
    if (step === 1) {
      var age = document.querySelector('input[name="age_range"]:checked');
      if (age && age.value === 'under_18') {
        accuShowModal({
          type: 'alert',
          tag: 'Minimum Age Requirement',
          title: 'Age Eligibility Notice',
          message: 'Candidates must be at least 18 years of age.'
        });
      }
    }
  };

  window.accuShowModal = function(opts) {
    ensureModalInBody();
    var modal = document.getElementById('accuModal');
    var icon = document.getElementById('accuModalIcon');
    var tag = document.getElementById('accuModalTag');
    var title = document.getElementById('accuModalTitle');
    var body = document.getElementById('accuModalBody');
    var actions = document.getElementById('accuModalActions');

    title.innerText = opts.title;
    tag.innerText = opts.tag;
    body.innerHTML = opts.message;

    actions.innerHTML = '<button onclick="accuCloseModal()">Close</button>';
    modal.style.setProperty('display', 'flex', 'important');
  };

  window.accuCloseModal = function() {
    var modal = document.getElementById('accuModal');
    if (modal) modal.style.setProperty('display', 'none', 'important');
  };
})();
</script>
</body>
</html>
